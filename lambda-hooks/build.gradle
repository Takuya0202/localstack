plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
	// CHECKPOINT: fat JAR を作るためのプラグイン。Lambda には依存関係込みの1ファイルが必要
	id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', '2024.0.1')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	// CHECKPOINT: これが Lambda 連携の核心。FunctionInvoker クラスがここに含まれる
	implementation 'org.springframework.cloud:spring-cloud-function-adapter-aws'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		// BOILERPLATE: Spring Cloud 全体のバージョンを BOM で一括管理する
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

shadowJar {
	// CHECKPOINT: classifier を空にしないと "-all" サフィックスが付き、
	//             CloudFormation の CodeUri とファイル名が合わなくなる
	archiveClassifier = ''
	manifest {
		attributes 'Start-Class': 'com.example.lambda_hooks.LambdaHooksApplication'
	}
	// BOILERPLATE: META-INF/services を正しくマージするために必要
	mergeServiceFiles()
}

// BOILERPLATE: gradle build で自動的に shadowJar も実行されるようにする
assemble.dependsOn shadowJar
