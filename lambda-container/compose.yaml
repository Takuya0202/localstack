services:
  localstack:
    container_name: localstack-lambda-container
    image: localstack/localstack:3
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - SERVICES=lambda,iam,logs,cloudformation,apigateway,s3
      - DEBUG=1
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - "./localstack_data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      # localstackコンテナが起動しているかどうかをcheckする。
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  init:
    container_name: init-lambda-container
    build:
      context: .
      dockerfile: setup/Dockerfile.init
    # localstack の healthcheck が通過するまで待機
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ap-northeast-1
      # CHECKPOINT: この変数1つで sam の全 AWS API 呼び出しが LocalStack に向く
      - AWS_ENDPOINT_URL=http://localstack:4566
    volumes:
      - ".:/app"
      - "gradle-cache:/root/.gradle"
      - "./setup/init.sh:/init.sh"

volumes:
  gradle-cache:
